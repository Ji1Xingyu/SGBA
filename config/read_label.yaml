
gmm:
# default voxel size for GMM initialization
  voxRes: 4.0

# Per-label voxel resolutions for GMM initialization
# for Gaussian mean initialization
  voxResPerLabel:
    40: 8.0   # road
    48: 8.0   # sidewalk  
    71: 2.0   # trunk
    80: 1.5   # pole
    70: 3.0   # vegetation
    50: 6.0   # building
    51: 2.5   # fence
    10: 3.0   # car 

  iterMax: 50
# iteration No. that the transformation matrix remains unchanged.
  TRemainThd: 0


# "kitti" - use KITTI semantic dataset
# "virtual_planes" - use synthetic virtual plane data
test_mode: "kitti"

# Virtual plane test configuration
virtual_planes:
  pcd_file: "/home/xingyu/catkin_ws/src/semanticBA/pcd/largeE3_6.pcd"
  max_frames: 20  # limit number of frames for testing
  use_identity_transforms: true  # start with identity transformations

semantic_kitti:
  kittiPath: "/home/xingyu/catkin_ws/datasets/kitti_semantic/01"
  # default voxel size for downsampling
  voxRes: .2

# Per-label voxel resolutions for point cloud downsampling
  voxResPerLabelFilter:
    40: 0.3   # road
    48: 0.3   # sidewalk
    71: 0.15  # trunk
    80: 0.1   # pole
    70: 0.2   # vegetation
    50: 0.25  # building
    51: 0.15  # fence
    10: 0.2   # car

  frameCnt: 400
  winSize: 20
  label2Read: [80, 71, 40, 48]  
  regulateT: true

  disKeyThd: 4.0
